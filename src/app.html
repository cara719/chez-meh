<!doctype html>
<html lang="en"><head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">

<meta name="theme-color" content="#082042">

<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: single narrow column, sticky tab bar. The Log tab is a step flow: visit setup, one card per dish, review. */
:root {
  --bg: #F4F5F1; --surface: #FFFFFF; --ink: #082042; --muted: #5C667A; --line: #D9DDD3;
  --food: #C2410C; --food-soft: #FDEBDD; --delivery: #0B7A75; --delivery-soft: #DDF1EF; --warn: #9A3412;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Trebuchet MS", sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151C; --surface: #1B2030; --ink: #ECEFF5; --muted: #9AA3B5; --line: #2C3347;
    --food: #FF8A57; --food-soft: #3A2417; --delivery: #3CC4BC; --delivery-soft: #12312F; --warn: #FDBA74;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151C; --surface: #1B2030; --ink: #ECEFF5; --muted: #9AA3B5; --line: #2C3347;
  --food: #FF8A57; --food-soft: #3A2417; --delivery: #3CC4BC; --delivery-soft: #12312F; --warn: #FDBA74;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-block: 0 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; }
header { padding-block: 22px 12px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 2.1rem; letter-spacing: -0.02em; margin: 0; line-height: 1; }
h1 span { color: var(--food); }
.tag { color: var(--muted); margin: 6px 0 0; font-size: .95rem; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; margin: 0; text-wrap: balance; }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
nav.tabs button { flex: 1; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); font: 700 .95rem var(--font-body); padding: 12px 4px 10px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--food); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--delivery); outline-offset: 2px; }
section.panel { padding-top: 20px; display: grid; gap: 18px; }
.flow { display: grid; gap: 18px; }
.field { display: grid; gap: 6px; min-width: 0; }
label, .lbl { font-weight: 700; font-size: .9rem; }
.hint { color: var(--muted); font-weight: 400; font-size: .85rem; }
input[type=text], input[type=number], input[type=datetime-local], textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; min-height: 46px;
}
textarea { min-height: 76px; resize: vertical; }
textarea:disabled { opacity: .5; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 700 .95rem var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; min-height: 44px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip small { font-weight: 400; opacity: .7; margin-left: 4px; }
#favForm .field { margin-bottom: 16px; }
#favForm .link { margin-bottom: 12px; }
.rate { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.rate button { height: 52px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: 500 1.25rem var(--font-mono); cursor: pointer; }
.rate.food button[aria-pressed="true"] { background: var(--food); border-color: var(--food); color: #fff; }
.rate.deliv button[aria-pressed="true"] { background: var(--delivery); border-color: var(--delivery); color: #fff; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 400; font-size: .9rem; color: var(--muted); }
.check input { width: 18px; height: 18px; }
.deliv-box { border-left: 4px solid var(--delivery); padding: 4px 0 4px 14px; display: grid; gap: 16px; }
.btn { font: 700 1rem var(--font-body); background: var(--ink); color: var(--bg); border: 0; border-radius: 8px; padding: 13px 18px; min-height: 48px; cursor: pointer; }
.btn.alt { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.grow { flex: 1 1 auto; }
.btn[disabled] { opacity: .5; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions .btn { flex: 1 1 140px; }
.link { background: none; border: 0; color: var(--muted); font: 700 .85rem var(--font-body); text-decoration: underline; cursor: pointer; padding: 6px 4px; }
.err { color: var(--warn); font-weight: 500; margin: 0; }
.banner { background: var(--food-soft); color: var(--ink); border-radius: 8px; padding: 12px 14px; margin-top: 14px; }
.stephead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--food); }
.dots i.done { background: var(--ink); }
.confirm { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.pips { font-family: var(--font-mono); letter-spacing: .12em; white-space: nowrap; }
.pips.food { color: var(--food); } .pips.deliv { color: var(--delivery); }
.badge { display: inline-block; font: 500 .72rem var(--font-mono); text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 4px; }
.badge.deliv { background: var(--delivery-soft); color: var(--delivery); }
.ask { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
.ask form { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 10px; }
.ask form.three { grid-template-columns: 1fr 1fr auto; }
.result { display: grid; gap: 12px; }
.result:empty { display: none; }
@media (max-width: 460px) { .ask form, .ask form.three { grid-template-columns: 1fr; } }
.entry { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; min-width: 0; }
.entry:first-child { border-top: 0; padding-top: 0; }
.entry .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.entry b { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: .85rem; }
.cmt { margin: 0; overflow-wrap: anywhere; }
.big { font: 500 1.6rem var(--font-mono); }
.empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 16px; margin: 0; }
.copy { width: 100%; font: .8rem var(--font-mono); min-height: 140px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
html.kb body { padding-bottom: 60vh; }
#rcFab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 20; width: 56px; height: 56px; padding: 0; border: 0; border-radius: 50%; overflow: hidden; cursor: pointer; background: var(--ink); box-shadow: 0 4px 14px rgba(8, 32, 66, .35); }
#rcFab img { width: 100%; height: 100%; display: block; object-fit: cover; }
html.kb #rcFab, html.rcopen #rcFab { display: none; }
html.rcopen body { overflow: hidden; }
.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(8, 20, 40, .55); display: flex; align-items: flex-end; justify-content: center; }
.sheet .pane { width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; background: var(--bg); border-radius: 16px 16px 0 0; padding: 20px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; align-content: start; }
.sheet h2:focus { outline: none; }
.rcimg { max-width: 100%; max-height: 180px; border-radius: 8px; border: 1px solid var(--line); justify-self: start; }
.banner ul { margin: 6px 0 0; padding-left: 18px; }
.flow > .banner { margin-top: 0; }
.field.miss { border-left: 4px solid var(--warn); padding-left: 10px; }
.field.miss > .lbl, .field.miss > label { color: var(--warn); }
.editbox { display: grid; gap: 16px; border: 2px solid var(--ink); border-radius: 10px; padding: 14px; background: var(--bg); }
.grp { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 4px 0 0; font-weight: 700; }
.confirmdel { background: var(--food-soft); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; }
@media (prefers-reduced-motion: no-preference) { .confirm { animation: rise .25s ease-out; } @keyframes rise { from { opacity: 0; transform: translateY(6px); } } }
</style></head><body>

<div class="wrap">
  <header>
    <h1>Chez <span>Meh</span></h1>
    <p class="tag">Your restaurant diary. Food and delivery are rated separately.</p>
  </header>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="t-log" aria-selected="true" aria-controls="p-log">Log</button>
    <button role="tab" id="t-ask" aria-selected="false" aria-controls="p-ask">Ask</button>
    <button role="tab" id="t-diary" aria-selected="false" aria-controls="p-diary">Diary</button>
  </nav>

  <div id="status" class="banner" hidden></div>
  <datalist id="dl-rest"></datalist><datalist id="dl-item"></datalist><datalist id="dl-cuisine"></datalist><datalist id="dl-app"></datalist><datalist id="dl-type"></datalist>

  <section class="panel" id="p-log" role="tabpanel" aria-labelledby="t-log">
    <div id="logRoot" class="flow"></div>
  </section>

  <section class="panel" id="p-ask" role="tabpanel" aria-labelledby="t-ask" hidden>
    <div class="ask">
      <h2>Best version of a dish</h2>
      <div id="favForm"></div>
      <div class="result" id="favOut" aria-live="polite"></div>
    </div>
    <div class="ask">
      <h2>How do I feel about a restaurant?</h2>
      <form id="qRest"><div class="field"><label for="restIn">Restaurant</label><input type="text" id="restIn" list="dl-rest" autocomplete="off"></div><button class="btn" type="submit">Summarize</button></form>
      <div class="result" id="restOut" aria-live="polite"></div>
    </div>
    <div class="ask">
      <h2>Top-rated meals</h2>
      <form id="qTop" class="three">
        <div class="field"><label for="topN">How many</label><input type="number" id="topN" min="1" max="50" value="5" inputmode="numeric"></div>
        <div class="field"><label for="topC">Cuisine <span class="hint">optional</span></label><input type="text" id="topC" list="dl-cuisine" autocomplete="off"></div>
        <button class="btn" type="submit">Show</button>
      </form>
      <div class="result" id="topOut" aria-live="polite"></div>
    </div>
    <div class="ask">
      <h2>Delivery apps</h2>
      <form id="qDel"><div class="field"><label for="delIn">App <span class="hint">blank for all apps</span></label><input type="text" id="delIn" list="dl-app" autocomplete="off"></div><button class="btn" type="submit">Compare</button></form>
      <div class="result" id="delOut" aria-live="polite"></div>
    </div>
  </section>

  <section class="panel" id="p-diary" role="tabpanel" aria-labelledby="t-diary" hidden>
    <div id="diary"></div>
  </section>
</div>

<button type="button" id="rcFab" aria-label="Add from a receipt or screenshot" title="Add from a receipt or screenshot"><img src="/icon-192.png" alt=""></button>
<div class="sheet" id="rc" hidden><div class="pane" role="dialog" aria-modal="true" aria-labelledby="rcT" id="rcBody"></div></div>
<input type="file" id="rcFile" accept="image/*" hidden>

<script>
(function () {
  "use strict";
  var TZ = "America/New_York";
  var CUISINES = ["American", "Chinese", "French", "Indian", "Italian", "Japanese", "Korean", "Mexican", "Thai", "Vietnamese", "Unknown"];
  var RATERS = ["Cara", "Jason", "Both", "Guest"];
  var state = { entries: [] };
  var $ = function (id) { return document.getElementById(id); };
  function h(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function norm(s) { return String(s == null ? "" : s).trim().toLowerCase(); }
  function pips(n, cls) { var s = ""; for (var i = 1; i <= 5; i++) s += i <= n ? "●" : "○"; return '<span class="pips ' + cls + '" aria-label="' + n + ' out of 5">' + s + "</span>"; }
  function fmtDate(iso) { var d = new Date(iso); return isNaN(d) ? "Unknown date" : d.toLocaleDateString("en-US", { timeZone: TZ, month: "short", day: "numeric", year: "numeric" }); }
  function ts(e) { var t = Date.parse(e.occurred_at); return isNaN(t) ? 0 : t; }
  function uid() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }

  /* ---------- time ---------- */
  function nyLocalNow() { return nyLocalFrom(new Date()); }
  function nyLocalFrom(d) {
    var p = {}; new Intl.DateTimeFormat("en-CA", { timeZone: TZ, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })
      .formatToParts(d).forEach(function (x) { p[x.type] = x.value; });
    return p.year + "-" + p.month + "-" + p.day + "T" + p.hour + ":" + p.minute;
  }
  function nyISO(local) { // wall-clock New York time -> ISO with offset
    var m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)$/.exec(local); if (!m) return null;
    var guess = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]));
    var off = new Intl.DateTimeFormat("en-US", { timeZone: TZ, timeZoneName: "longOffset" }).formatToParts(guess).filter(function (x) { return x.type === "timeZoneName"; })[0].value;
    var mm = /GMT([+-])(\d\d):?(\d\d)?/.exec(off); var sign = mm ? mm[1] : "-", oh = mm ? mm[2] : "05", om = mm && mm[3] ? mm[3] : "00";
    return m[1] + "-" + m[2] + "-" + m[3] + "T" + m[4] + ":" + m[5] + ":00" + sign + oh + ":" + om;
  }

  /* ---------- query logic (spec section 7) ---------- */
  var Q = {
    versions: function (entries, f) { // every version in the chosen cuisines and dish types, ranked: one row per restaurant and dish name
      var cs = (f && f.cuisines || []).map(norm), ts_ = (f && f.types || []).map(norm), g = {};
      if (!cs.length && !ts_.length) return [];
      entries.forEach(function (e) {
        if (!Number.isInteger(e.food_rating)) return;
        if (cs.length && cs.indexOf(norm(e.cuisine_type)) < 0) return;
        if (ts_.length && ts_.indexOf(norm(e.dish_type)) < 0) return;
        var key = norm(e.restaurant) + "|" + norm(e.item);
        var o = g[key] || (g[key] = { restaurant: e.restaurant, item: e.item, type: e.dish_type || "", cuisine: e.cuisine_type || "", sum: 0, n: 0, last: -1, lastEntry: null });
        o.sum += e.food_rating; o.n++;
        if (ts(e) >= o.last) { o.last = ts(e); o.lastEntry = e; }
      });
      return Object.keys(g).map(function (x) { var o = g[x]; o.avgNum = o.sum / o.n; o.avg = o.avgNum.toFixed(2); return o; })
        .sort(function (a, b) { return b.avgNum - a.avgNum || b.n - a.n || b.last - a.last; });
    },
    restaurant: function (entries, name) {
      var k = norm(name), m = entries.filter(function (e) { return norm(e.restaurant) === k && Number.isInteger(e.food_rating); });
      if (!m.length) return { count: 0 };
      var sum = m.reduce(function (a, e) { return a + e.food_rating; }, 0);
      return { count: m.length, avg: (sum / m.length).toFixed(2), name: m[0].restaurant, rows: m.slice().sort(function (a, b) { return ts(b) - ts(a); }) };
    },
    top: function (entries, n, cuisine) {
      var c = norm(cuisine);
      return entries.filter(function (e) { return Number.isInteger(e.food_rating) && (!c || norm(e.cuisine_type) === c); })
        .sort(function (a, b) { return b.food_rating - a.food_rating || ts(b) - ts(a); }).slice(0, n);
    },
    delivery: function (entries, app) { // one rating per order: dishes sharing a visit_id count once
      var k = norm(app), g = {}, seen = {};
      entries.forEach(function (e) {
        if (!Number.isInteger(e.delivery_rating)) return;
        var vk = e.visit_id || e.entry_id; if (vk) { if (seen[vk]) return; seen[vk] = 1; }
        var a = e.delivery_app ? e.delivery_app.trim() : "";
        if (k && norm(a) !== k) return;
        var key = a ? norm(a) : "";
        if (!g[key]) g[key] = { label: a || "App not recorded", sum: 0, n: 0, rows: [] };
        g[key].sum += e.delivery_rating; g[key].n++; g[key].rows.push(e);
      });
      return Object.keys(g).map(function (x) { var o = g[x]; o.avg = (o.sum / o.n).toFixed(2); return o; }).sort(function (a, b) { return b.sum / b.n - a.sum / a.n; });
    }
  };

  /* ---------- shared rendering ---------- */
  function raterText(e) {
    if (e.rated_by === "Guest") return "Guest" + (e.rater_name ? " (" + e.rater_name + ")" : "");
    return e.rated_by || e.created_by || "";
  }
  function entryHtml(e) { return entryCard(e, ""); }
  function entryCard(e, extra) {
    var who = raterText(e);
    var out = '<div class="entry"><div class="top"><b>' + h(e.item) + "</b>" + pips(e.food_rating, "food") + "</div>" +
      '<div class="meta">' + (e.dish_type ? h(e.dish_type) + " · " : "") + h(e.restaurant) + " · " + h(e.cuisine_type || "Unknown") + " · " + (e.service_type === "delivery" ? "Delivery" : "Dine-in") + " · " + fmtDate(e.occurred_at) + (who ? " · Rated by " + h(who) : "") + (e.updated_at ? " · edited" : "") + "</div>";
    if (e.food_comment) out += '<p class="cmt">' + h(e.food_comment) + "</p>";
    if (e.service_type === "delivery" && Number.isInteger(e.delivery_rating)) {
      out += '<div class="meta"><span class="badge deliv">Delivery</span> ' + h(e.delivery_app || "App not recorded") + " " + pips(e.delivery_rating, "deliv") + (e.delivery_comment ? " · " + h(e.delivery_comment) : "") + "</div>";
    }
    return out + (extra || "") + "</div>";
  }
  function emptyMsg(t) { return '<p class="empty">' + h(t) + "</p>"; }
  function showStatus(msg) { var s = $("status"); s.textContent = msg; s.hidden = !msg; }

  var ED = null;  // the entry being edited: { id, f, n, legacy, visit, err, saving }
  var DL = null;  // id of an entry waiting for delete confirmation
  var DLERR = "";
  var TP = null;  // adding a type to an older dish: { id, adding, val, err }
  function renderDiary(force) {
    if ((ED || (TP && TP.adding)) && !force) return; // do not wipe an edit in progress when the list refreshes
    var list = state.entries.slice().sort(function (a, b) { return ts(b) - ts(a); });
    $("diary").innerHTML = typePanel(list) + (list.length ? '<div class="ask">' + list.map(function (e) {
      return ED && ED.id === e.entry_id ? editForm(e) : entryCard(e, rowActions(e));
    }).join("") + "</div>" : emptyMsg("No meals logged yet. Use the Log tab to add your first one."));
  }
  function typePanel(list) {
    var un = list.filter(function (e) { return !e.dish_type; });
    if (!un.length) return "";
    var s = '<div class="ask" style="margin-bottom:18px"><h2>Add a type to older dishes</h2><p class="meta" style="margin:0">' + un.length + (un.length === 1 ? " dish was" : " dishes were") +
      " logged before dish types existed. Tap a type to add it. Until then they still match by their dish name.</p>";
    un.forEach(function (e) {
      var id = h(e.entry_id), adding = TP && TP.adding && TP.id === e.entry_id;
      s += '<div class="entry"><div class="top"><b>' + h(e.item) + '</b></div><div class="meta">' + h(e.restaurant) + " · " + h(e.cuisine_type) + '</div><div class="chips">' +
        typesFor(e.cuisine_type).map(function (t) { return '<button type="button" class="chip" data-act="tpPick" data-id="' + id + '" data-v="' + h(t.name) + '">' + h(t.name) + "</button>"; }).join("") +
        '<button type="button" class="chip" data-act="tpNew" data-id="' + id + '" aria-pressed="' + (adding ? "true" : "false") + '">+ New type</button></div>';
      if (adding) s += '<div class="row"><input type="text" id="tp-input" data-tp="1" list="dl-type" value="' + h(TP.val) + '" placeholder="e.g. Italian sub" autocomplete="off" aria-label="Dish type" style="flex:1 1 180px;font:inherit;padding:11px 12px;min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)">' +
        '<button type="button" class="btn" data-act="tpSave" data-id="' + id + '">Save type</button></div>' + (TP.err ? '<p class="err">' + h(TP.err) + "</p>" : "");

  async function saveAll() {

  async function rcFile(file) {
    if (!file || !RC) return;
    if (!/^image\//.test(file.type)) { RC.err = "That isn't a picture. Choose a photo or a screenshot."; RC.phase = RC.img ? "ready" : "pick"; renderRc(); return; }
    var me = RC; me.phase = "preparing"; me.err = ""; renderRc();
    try { me.img = await shrinkImage(file); me.phase = "ready"; }
    catch (e) { me.err = e && e.message === "big" ? "That picture is too large. Try a screenshot instead." : "I couldn't open that picture. Try a screenshot or a JPEG or PNG photo."; me.phase = me.img ? "ready" : "pick"; }
    if (RC === me) renderRc();
  }
  async function rcRead() {
    var me = RC; if (!me || !me.img) return;
    me.phase = "reading"; me.err = ""; renderRc();
    try {
      var res = await fetch("/api/receipt", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ image: { mediaType: me.img.mediaType, data: me.img.data }, note: me.note.trim() }) });
      if (res.status === 401) { location.href = "/login"; return; }
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok || !data.ok) { me.phase = "ready"; me.err = data.error || "I couldn't read that image."; }
      else { me.result = data.result; me.plan = planReceipt(data.result); me.phase = "result"; }
    } catch (e) { me.phase = "ready"; me.err = "Could not reach the server. Check your connection."; }
    if (RC === me) renderRc();
  }
  $("rcFab").addEventListener("click", rcOpen);
  $("rcFile").addEventListener("change", function (ev) { var f = ev.target.files && ev.target.files[0]; ev.target.value = ""; rcFile(f); });
  $("rc").addEventListener("click", function (ev) {
    if (ev.target === $("rc")) return rcClose();
    var el = ev.target.closest("[data-rc]"); if (!el || el.disabled) return; var a = el.getAttribute("data-rc");
    if (a === "choose") $("rcFile").click(); else if (a === "close") rcClose(); else if (a === "read") rcRead(); else if (a === "fill" && RC && RC.plan) applyReceipt(RC.plan);
  });
  $("rc").addEventListener("input", function (ev) { if (RC && ev.target.getAttribute("data-rcin") === "note") RC.note = ev.target.value; });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && RC) rcClose(); });

  /* ---------- keyboard: keep the focused field visible ---------- */
  function isTextField(t) { return t && /^(INPUT|TEXTAREA)$/.test(t.tagName) && t.type !== "checkbox" && t.type !== "radio"; }
  function reveal(t) { try { t.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (e) { t.scrollIntoView(); } }
  document.addEventListener("focusin", function (ev) {
    var t = ev.target; if (!isTextField(t)) return;
    document.documentElement.classList.add("kb"); // gives the page room to scroll above the keyboard
    setTimeout(function () { if (document.activeElement === t) reveal(t); }, 350);
  });
  document.addEventListener("focusout", function () {
    setTimeout(function () { if (!isTextField(document.activeElement)) document.documentElement.classList.remove("kb"); }, 200);
  });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", function () {
    var a = document.activeElement; if (isTextField(a)) setTimeout(function () { reveal(a); }, 60);
  });

  /* ---------- ask forms ---------- */
  function noData() { return emptyMsg("No matching records."); }
  var FV = { cuisines: [], types: [] }; // chosen filters; none chosen = nothing selected yet
  function pickList(f, within) { // existing values only, most-used first; optionally limited to the chosen cuisines
    var m = {}, cs = (within || []).map(norm);
    state.entries.forEach(function (e) {
      var v = (e[f] || "").trim(); if (!v) return;
      if (f === "dish_type" && cs.length && cs.indexOf(norm(e.cuisine_type)) < 0) return;
      var n = norm(v); if (!m[n]) m[n] = { name: v, count: 0 }; m[n].count++;
    });
    return Object.keys(m).map(function (x) { return m[x]; }).sort(function (a, b) { return b.count - a.count || (a.name < b.name ? -1 : 1); });
  }
  function has(arr, v) { return arr.map(norm).indexOf(norm(v)) > -1; }
  function renderFav() {
    var cu = pickList("cuisine_type"), ty = pickList("dish_type", FV.cuisines);
    FV.types = FV.types.filter(function (t) { return ty.some(function (x) { return norm(x.name) === norm(t); }); }); // drop types that no longer fit the chosen cuisines
    var s = '<div class="field"><span class="lbl">Cuisine <span class="hint">pick one or more</span></span>' +
      (cu.length ? '<div class="chips">' + cu.map(function (c) { return chip("fvC", c.name, c.name, has(FV.cuisines, c.name), "<small>" + c.count + "</small>"); }).join("") + "</div>" : '<p class="empty">No cuisines logged yet.</p>') + "</div>" +
      '<div class="field"><span class="lbl">Dish type <span class="hint">' + (FV.cuisines.length ? "for the chosen cuisines" : "all cuisines") + ", pick one or more</span></span>" +
      (ty.length ? '<div class="chips">' + ty.map(function (t) { return chip("fvT", t.name, t.name, has(FV.types, t.name), "<small>" + t.count + "</small>"); }).join("") + "</div>" : '<p class="empty">No dish types logged yet.</p>') + "</div>" +
      ((FV.cuisines.length || FV.types.length) ? '<button type="button" class="link" data-act="fvClear">Clear choices</button>' : "");
    $("favForm").innerHTML = s;
    renderFavResults();
  }
  function renderFavResults() {
    var out = $("favOut");
    if (!FV.cuisines.length && !FV.types.length) { out.innerHTML = emptyMsg("Pick a cuisine, a dish type, or both to see every version ranked."); return; }
    var r = Q.versions(state.entries, FV);
    if (!r.length) { out.innerHTML = noData(); return; }
    var places = {}; r.forEach(function (x) { places[norm(x.restaurant)] = 1; }); var np = Object.keys(places).length;
    out.innerHTML = '<div class="meta">' + r.length + (r.length === 1 ? " version" : " versions") + " across " + np + (np === 1 ? " restaurant" : " restaurants") + ", best first. Averages are food ratings only.</div>" +
      r.map(function (x, i) {
        var le = x.lastEntry;
        return '<div class="entry"><div class="top"><b>#' + (i + 1) + " " + h(x.item) + '</b><span class="big">' + x.avg + "</span></div>" +
          '<div class="meta">' + h(x.restaurant) + (x.type ? " · " + h(x.type) : "") + (x.cuisine ? " · " + h(x.cuisine) : "") + " · " + x.n + (x.n === 1 ? " try" : " tries") + " · last " + fmtDate(le.occurred_at) + "</div>" +
          (le.food_comment ? '<p class="cmt">' + h(le.food_comment) + "</p>" : "") + "</div>";
      }).join("");
  }
  function toggle(arr, v) { var i = arr.map(norm).indexOf(norm(v)); if (i > -1) arr.splice(i, 1); else arr.push(v); }
  $("favForm").addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-act]"); if (!el) return; var a = el.getAttribute("data-act"), v = el.getAttribute("data-v");
    if (a === "fvC") toggle(FV.cuisines, v); else if (a === "fvT") toggle(FV.types, v); else if (a === "fvClear") FV = { cuisines: [], types: [] }; else return;
    renderFav();
  });
  $("qRest").addEventListener("submit", function (ev) {
    ev.preventDefault(); var q = $("restIn").value.trim(), out = $("restOut"); if (!q) { out.innerHTML = emptyMsg("Enter a restaurant."); return; }
    var r = Q.restaurant(state.entries, q);
    if (!r.count) { out.innerHTML = noData(); return; }
    out.innerHTML = '<div><div class="big">' + r.avg + '</div><div class="meta">average food rating across ' + r.count + (r.count === 1 ? " entry" : " entries") + " for " + h(r.name) + ". Delivery ratings are not included.</div></div>" +
      r.rows.map(entryHtml).join("");
  });
  $("qTop").addEventListener("submit", function (ev) {
    ev.preventDefault(); var n = Math.max(1, Math.min(50, parseInt($("topN").value, 10) || 5)), c = $("topC").value.trim(), out = $("topOut");
    var r = Q.top(state.entries, n, c);
    if (!r.length) { out.innerHTML = noData(); return; }
    out.innerHTML = r.map(function (e, i) { return '<div><div class="meta">#' + (i + 1) + "</div>" + entryHtml(e).replace('<div class="entry">', "<div>") + "</div>"; }).join("");
  });
  $("qDel").addEventListener("submit", function (ev) {
    ev.preventDefault(); var out = $("delOut"), r = Q.delivery(state.entries, $("delIn").value);
    if (!r.length) { out.innerHTML = emptyMsg("No delivery ratings recorded" + ($("delIn").value.trim() ? " for that app." : " yet.")); return; }
    out.innerHTML = r.map(function (g) {
      return '<div class="entry"><div class="top"><b>' + h(g.label) + '</b><span class="big">' + g.avg + '</span></div><div class="meta">' + g.n + (g.n === 1 ? " order rated" : " orders rated") + (g.n < 3 ? " · too few to call it a verdict" : "") + "</div></div>";
    }).join("");
  });

  /* ---------- startup ---------- */
  resetLog(); renderLog(); fillLists(); renderDiary();
  try { var t = sessionStorage.getItem("cm-tab"); if (t && tabs.indexOf(t) > -1) $("t-" + t).click(); } catch (e) {}
  $("diary").innerHTML = emptyMsg("Loading the diary…");
  var loaded = false;
  async function load() {
    try {
      var res = await fetch("/api/entries", { cache: "no-store" });
      if (res.status === 401) { location.href = "/login"; return; }
      if (!res.ok) throw new Error("load");
      state.entries = (await res.json()).entries; loaded = true; showStatus(""); refresh();
    } catch (e) { if (!loaded) { showStatus("The diary could not be loaded. Check your connection and reload."); $("diary").innerHTML = emptyMsg("Could not load the diary."); } }
  }
  load();
  document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
  setInterval(function () { if (!document.hidden) load(); }, 30000);
  window.__chezMehQ = Q;
})();
</script>
</body></html>
